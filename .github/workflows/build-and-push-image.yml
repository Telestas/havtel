name: Build And Push Container Image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Notify Telegram on test failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "${TELEGRAM_BOT_TOKEN:-}" ] && exit 0
          CURL_ARGS=(
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
            --data-urlencode "parse_mode=HTML"
            --data-urlencode "text=❌ <b>${REPO_NAME}</b> — tests fallaron | <a href=\"${RUN_URL}\">Ver run</a>"
          )
          [ -n "${TELEGRAM_THREAD_ID:-}" ] && CURL_ARGS+=(--data-urlencode "message_thread_id=${TELEGRAM_THREAD_ID}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" "${CURL_ARGS[@]}"

  publish:
    runs-on: ubuntu-latest
    needs: [test]
    # The frontend bakes its API base URL and Stripe publishable key at build
    # time, so a single image only works for one environment. We run the build
    # twice — once per env — using a matrix so each environment gets its own
    # image tagged with an `{env}-` prefix.
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate workflow ref
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual executions are only allowed from the main branch."
            exit 1
          fi

      - name: Ensure tag points to main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "The pushed tag does not point to a commit contained in main."
            exit 1
          fi

      - name: Sync package.json version with tag
        if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Resolve env-specific build vars
        id: vars
        env:
          MATRIX_ENV: ${{ matrix.env }}
          VITE_API_BASE_URL_DEV: ${{ vars.VITE_API_BASE_URL_DEV }}
          VITE_API_BASE_URL_PROD: ${{ vars.VITE_API_BASE_URL_PROD }}
          VITE_STRIPE_PUBLISHABLE_KEY_DEV: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY_DEV }}
          VITE_STRIPE_PUBLISHABLE_KEY_PROD: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY_PROD }}
        run: |
          if [ "$MATRIX_ENV" = "dev" ]; then
            API_BASE_URL="$VITE_API_BASE_URL_DEV"
            STRIPE_KEY="$VITE_STRIPE_PUBLISHABLE_KEY_DEV"
          else
            API_BASE_URL="$VITE_API_BASE_URL_PROD"
            STRIPE_KEY="$VITE_STRIPE_PUBLISHABLE_KEY_PROD"
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL_${MATRIX_ENV^^} is empty or not configured in repository variables."
            exit 1
          fi
          if [ -z "$STRIPE_KEY" ]; then
            echo "VITE_STRIPE_PUBLISHABLE_KEY_${MATRIX_ENV^^} is empty or not configured in repository variables."
            exit 1
          fi

          # Mask the publishable key in logs even though it's a public key —
          # cleaner output and prevents accidental copy-paste.
          echo "::add-mask::$STRIPE_KEY"
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "stripe_key=$STRIPE_KEY" >> "$GITHUB_OUTPUT"

      - name: Compute image names
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          MATRIX_ENV: ${{ matrix.env }}
        run: |
          echo "IMAGE_NAME=ghcr.io/${REPO_OWNER,,}/${REPO_NAME,,}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${REPO_NAME,,}" >> "$GITHUB_ENV"

          # Channel = floating tag that always points to the latest build for
          # this env. Semver tags are env-prefixed so dev/prod don't collide.
          echo "CHANNEL_TAG=${MATRIX_ENV}-latest" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION_TAG=${MATRIX_ENV}-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_TAG=${MATRIX_ENV}-main" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.vars.outputs.api_base_url }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ steps.vars.outputs.stripe_key }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CHANNEL_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}

      - name: Delete previous container versions for this env
        uses: actions/github-script@v8
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          MATRIX_ENV: ${{ matrix.env }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
          CHANNEL_TAG: ${{ env.CHANNEL_TAG }}
          # How many recent versions per env to retain so a deploy can roll back.
          KEEP_VERSIONS: "5"
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = process.env.PACKAGE_NAME;
            const envPrefix = `${process.env.MATRIX_ENV}-`;
            const keepTags = new Set([process.env.VERSION_TAG, process.env.CHANNEL_TAG]);
            const packageType = "container";
            const ownerType = context.payload.repository.owner.type;

            const listVersions = ownerType === "Organization"
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;

            const deleteVersion = ownerType === "Organization"
              ? github.rest.packages.deletePackageVersionForOrg
              : github.rest.packages.deletePackageVersionForUser;

            const baseParams = ownerType === "Organization"
              ? { org: owner, package_type: packageType, package_name: packageName }
              : { username: owner, package_type: packageType, package_name: packageName };

            let versions;
            try {
              versions = await github.paginate(listVersions, {
                ...baseParams,
                per_page: 100,
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Package ${packageName} does not exist yet. Nothing to delete.`);
                return;
              }
              throw error;
            }

            const taggedVersions = versions
              .map((version) => ({
                ...version,
                tags: version.metadata?.container?.tags ?? [],
              }))
              .filter((version) => version.tags.length > 0)
              // Only manage versions belonging to THIS env so dev runs don't
              // delete prod versions and vice versa.
              .filter((version) => version.tags.some((t) => t.startsWith(envPrefix)))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // Retain the newest `keepCount` versions for this env, plus the
            // just-built and channel tags. Deleting every prior version (the
            // old behaviour) removed the exact digests a failed deploy needs to
            // roll back to, leaving prod with no recovery path.
            const keepCount = Number(process.env.KEEP_VERSIONS || "5");
            for (let i = 0; i < taggedVersions.length; i++) {
              const version = taggedVersions[i];
              const isProtected = version.tags.some((t) => keepTags.has(t));

              if (i < keepCount || isProtected) {
                core.info(`Keeping ${envPrefix}* version ${version.id} with tags: ${version.tags.join(", ")}`);
                continue;
              }

              core.info(`Deleting old ${envPrefix}* version ${version.id} with tags: ${version.tags.join(", ")}`);
              await deleteVersion({
                ...baseParams,
                package_version_id: version.id,
              });
            }

      - name: Trigger dev deploy on havtel-infra
        # Only the matrix-dev job triggers the auto-deploy. The matrix-prod
        # build produces the `prod-latest` image but waits for manual approval.
        if: success() && matrix.env == 'dev' && github.ref_type == 'tag'
        env:
          DEPLOY_DISPATCH_PAT: ${{ secrets.DEPLOY_DISPATCH_PAT }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ -z "${DEPLOY_DISPATCH_PAT:-}" ] && { echo "DEPLOY_DISPATCH_PAT not set, skipping auto-deploy."; exit 0; }

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_DISPATCH_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Telestas/havtel-infra/dispatches" \
            -d "{\"event_type\":\"deploy-frontend\",\"client_payload\":{\"target_env\":\"dev\",\"pin_tag\":\"dev-${REF_NAME}\"}}" \
            -w "  -> HTTP %{http_code}\n"

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          MATRIX_ENV: ${{ matrix.env }}
        run: |
          [ -z "${TELEGRAM_BOT_TOKEN:-}" ] && exit 0
          CURL_ARGS=(
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
            --data-urlencode "parse_mode=HTML"
            --data-urlencode "text=✅ <b>${REPO_NAME}</b> <code>${MATRIX_ENV}-${REF_NAME}</code> — imagen publicada"
          )
          [ -n "${TELEGRAM_THREAD_ID:-}" ] && CURL_ARGS+=(--data-urlencode "message_thread_id=${TELEGRAM_THREAD_ID}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" "${CURL_ARGS[@]}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          MATRIX_ENV: ${{ matrix.env }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "${TELEGRAM_BOT_TOKEN:-}" ] && exit 0
          CURL_ARGS=(
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
            --data-urlencode "parse_mode=HTML"
            --data-urlencode "text=❌ <b>${REPO_NAME}</b> <code>${MATRIX_ENV}-${REF_NAME}</code> — build fallido | <a href=\"${RUN_URL}\">Ver run</a>"
          )
          [ -n "${TELEGRAM_THREAD_ID:-}" ] && CURL_ARGS+=(--data-urlencode "message_thread_id=${TELEGRAM_THREAD_ID}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" "${CURL_ARGS[@]}"
